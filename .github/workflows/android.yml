name: Android APK 빌드
on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run sync
      - name: 디버그 APK 빌드
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: golmok-hanpan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

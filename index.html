<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>골목한판</title>
<style>
html,body{margin:0;height:100%;background:#2b1d12;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(43,29,18,.92);color:#fbeed7;text-align:center;padding:20px;box-sizing:border-box;overflow-y:auto}
.hidden{display:none}
h1{font-size:42px;margin:0 0 4px;color:#ffd58a;letter-spacing:3px}
h2{font-size:30px;margin:0 0 10px;color:#ffd58a}
p{font-size:21px;line-height:1.55;margin:6px 0}
.big{font-size:25px;font-weight:700}
.sub{font-size:16px;opacity:.75}
button{font-size:26px;font-weight:700;padding:16px 30px;border-radius:16px;border:none;background:#e0892b;color:#fff;margin:10px 6px 0;min-width:140px;box-shadow:0 4px 0 #8f5214;font-family:inherit}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8f5214}
button.alt{background:#6b4a2e;box-shadow:0 4px 0 #3d2a19}
button.share{background:#f2c94c;color:#3b2a10;box-shadow:0 4px 0 #a5821d}
.stages{display:flex;flex-direction:column;gap:14px;width:min(420px,92vw);margin-top:14px}
.stages button{margin:0;text-align:left;padding:16px 20px;font-size:24px}
.stages small{display:block;font-size:16px;font-weight:400;opacity:.9;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;width:min(420px,90vw)}
.opts button{margin:0;font-size:28px;padding:20px 0;min-width:0}
.hand{display:flex;gap:12px;justify-content:center;margin:10px 0 0}
.hand div{background:#5a3b22;border-radius:14px;padding:10px 14px;font-size:18px}
.ok{color:#9be37a}.no{color:#ff9a7a}
.ov{justify-content:safe center}
.daily{background:#f2c94c;color:#3b2a10;box-shadow:0 4px 0 #a5821d;width:min(420px,92vw);margin:8px 0 4px;font-size:26px}
.daily small{display:block;font-size:16px;font-weight:400;margin-top:4px}
.small{font-size:18px;padding:10px 18px;min-width:0}
.fl{display:block;width:min(380px,90vw);text-align:left;font-size:20px;font-weight:700;margin:12px 0 0}
.fl input{display:block;width:100%;box-sizing:border-box;font-size:26px;padding:12px 14px;border-radius:12px;border:2px solid #8f5214;background:#fbeed7;color:#2b1d12;margin-top:6px;font-family:inherit}
.agebox{display:flex;gap:8px;align-items:center;margin-top:6px}.agebox input{margin:0;text-align:center}.agebox button{margin:0;min-width:64px;padding:12px 0;font-size:30px}
.seg{display:flex;gap:8px;margin-top:6px}.seg button{flex:1;margin:0;min-width:0;font-size:20px;padding:12px 0;background:#6b4a2e;box-shadow:0 4px 0 #3d2a19}.seg button.on{background:#e0892b;box-shadow:0 4px 0 #8f5214}
.rec{width:min(420px,92vw);text-align:left}.rec h3{font-size:19px;color:#ffd58a;margin:16px 0 6px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sum div{background:#5a3b22;border-radius:12px;padding:10px 4px;font-size:16px}.sum b{display:block;font-size:28px;color:#ffd58a}
.rrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:18px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:16px}.bl{width:48px}.bt{flex:1;height:14px;background:#3d2a19;border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;background:#e0892b}.bv{width:44px;text-align:right}
#cardImg{width:min(320px,80vw);border-radius:12px;margin:10px 0;box-shadow:0 6px 20px rgba(0,0,0,.4);-webkit-touch-callout:default;user-select:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="startOv" class="ov">
  <h1>골목한판</h1>
  <p class="big" id="greet" style="margin:0">추억의 골목에서 한 판!</p>
  <p id="streak" style="margin:2px 0;color:#ffb36b;font-weight:700"></p>
  <button id="dailyBtn" class="daily"></button>
  <div class="hand"><div>👈 왼쪽은 <b>왼손</b></div><div><b>오른손</b>은 오른쪽 👉</div></div>
  <p class="sub" style="margin-top:8px">🔍 배경도 잘 봐두세요! 끝나면 눈썰미 퀴즈가 나와요</p>
  <div class="stages" id="stageList"></div>
  <div><button id="recOpen" class="alt small">📒 내 기록</button><button id="profOpen" class="alt small">👤 내 정보</button></div>
  <p class="sub" style="margin-top:10px">소리를 켜고 해주세요 · PC는 F / J 키</p>
  <button id="calibOpen" class="alt small">🎧 소리가 늦게 들리면? 박자 맞추기</button>
  <p class="sub" id="offsetNow"></p>
</div>

<div id="profOv" class="ov hidden">
  <h2>👤 반가워요!</h2>
  <p class="sub">회원가입 없이, 이 휴대폰에만 저장돼요</p>
  <label class="fl">별명<input id="pNick" maxlength="10" placeholder="예: 안양 김씨" autocomplete="off"></label>
  <div class="fl">나이<div class="agebox"><button id="ageMinus" class="alt">−</button><input id="pAge" type="number" inputmode="numeric" min="10" max="110" placeholder="65"><button id="agePlus" class="alt">＋</button></div></div>
  <div class="fl">성별 <span class="sub">(선택)</span><div class="seg" id="pGender"><button data-g="m">남자</button><button data-g="f">여자</button><button data-g="">안 알려줌</button></div></div>
  <button id="profSave" style="margin-top:20px">저장하고 시작</button>
  <button id="profSkip" class="alt small">나중에 할게요</button>
</div>

<div id="recOv" class="ov hidden">
  <h2>📒 내 기록</h2>
  <div id="recBody" class="rec"></div>
  <button id="recClose" class="alt">닫기</button>
</div>

<div id="calibOv" class="ov hidden">
  <h2>🎧 박자 맞추기</h2>
  <p>'똑' 소리가 들릴 때마다<br>아래 큰 버튼을 <b>톡</b> 눌러주세요</p>
  <p class="sub">화면보다 소리에 집중하세요 · 12번 울려요</p>
  <button id="calibPad" style="width:min(320px,80vw);height:200px;font-size:34px;margin-top:16px">톡!</button>
  <p id="calibMsg" class="big" style="min-height:70px"></p>
  <div>
    <button id="calibStart">시작</button>
    <button id="calibReset" class="alt">초기화</button>
    <button id="calibClose" class="alt">닫기</button>
  </div>
</div>

<div id="quizOv" class="ov hidden">
  <h2>🔍 눈썰미 퀴즈</h2>
  <p class="big" id="qText"></p>
  <p class="sub" id="qSub"></p>
  <div id="opts" class="opts"></div>
</div>

<div id="resultOv" class="ov hidden">
  <h2 id="rTitle"></h2>
  <p id="rQuiz" class="big"></p>
  <p id="rScore"></p>
  <p id="rMsg"></p>
  <div>
    <button id="shareBtn" class="share">📣 자랑하기</button>
    <button id="againBtn">한 판 더</button>
  </div>
  <button id="menuBtn" class="alt">다른 판 고르기</button>
</div>

<div id="cardOv" class="ov hidden">
  <h2>📣 자랑하기</h2>
  <img id="cardImg" alt="결과 카드">
  <p class="sub">사진을 꾹 눌러서 저장한 뒤<br>카톡으로 보내보세요</p>
  <div>
    <button id="copyBtn" class="share">링크 복사</button>
    <button id="cardClose" class="alt">닫기</button>
  </div>
  <p class="sub" id="copyMsg"></p>
</div>

<script>
{
const SITE='https://pth090526.github.io/golmok-hanpan/';
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr,sceneH,hitY,laneX;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  sceneH=Math.round(H*0.4);hitY=Math.round(H-Math.max(110,H*0.16));laneX={L:W*0.28,R:W*0.72};}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LEAD=1.9,WIN_PERF=0.08,WIN_GOOD=0.18;
let ac=null,start=0,BEAT=0.625,END_T=40,notes=[],walkers=[],pops=[],sparks=[],state='idle',score,hammer={L:-9,R:-9},noiseBuf,stage=null,quiz=null,lastResult=null,errs=[];
let DATA={profile:null,asked:false,history:[],best:{},streak:0,lastDate:'',plays:0};
try{const v=JSON.parse(localStorage.getItem('gh_data'));if(v&&typeof v==='object')DATA=Object.assign(DATA,v);}catch(e){}
function save(){try{localStorage.setItem('gh_data',JSON.stringify(DATA));}catch(e){}}
let OFFSET=0;try{OFFSET=parseFloat(localStorage.getItem('gh_offset'))||0;}catch(e){}
function now(){return ac?ac.currentTime-(ac.outputLatency||0)-start:-3;}
function songT(){return now()-OFFSET;}
function ensureAudio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}ac.resume();}

// ===== 사운드 =====
function env(node,t,v,d){const gn=ac.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.008);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);node.connect(gn).connect(ac.destination);}
function tone(f,t,d,type,v){const o=ac.createOscillator();o.type=type||'triangle';o.frequency.value=f;env(o,t,v||0.12,d);o.start(t);o.stop(t+d+0.05);}
function drum(t,f,v){const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*0.5,t+0.18);env(o,t,v,0.28);o.start(t);o.stop(t+0.32);}
function noise(t,type,freq,v,d){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=3;s.connect(f);env(f,t,v,d);s.start(t);s.stop(t+d+0.03);}
function whiff(){noise(ac.currentTime,'highpass',4000,0.08,0.08);}
const SC=[261.6,293.7,329.6,392.0,440.0,523.3,587.3];
function scheduleMusic(mel,perc){
  for(let b=0;b<64;b++){const t=start+b*BEAT,bar=Math.floor(b/4),bb=b%4;
    if(bar<2){tone(bb===0?1500:1150,t,0.07,'square',0.07);continue;}
    if(bar===15){if(bb===0){tone(SC[0],t,1.6,'triangle',0.16);tone(SC[0]/2,t,1.6,'sine',0.12);drum(t,85,0.7);}continue;}
    const m=SC[mel[(b-8)%mel.length]];tone(m,t,0.42,'triangle',0.11);
    perc(t,bb,m);}
}

// ===== 그리기 도구 =====
function walkerX(p,st,x0,x1){const k=(st-p.t)/p.dur;if(k<0||k>1)return null;return p.dir>0?x0+k*(x1-x0):x1-k*(x1-x0);}
function drawWalker(x,y,p,st,sc){const s=(sceneH/210)*(sc||1),sw=Math.sin(st*11)*0.5;g.save();g.translate(x,y);g.scale(s*p.dir,s);g.lineCap='round';
  const k=p.kind;
  if(k==='dog'||k==='cat'){const col=k==='dog'?'#8b5a2b':'#d08a3a';g.fillStyle=col;g.strokeStyle=col;g.lineWidth=5;
    for(const lx of[-14,12]){g.beginPath();g.moveTo(lx,-14);g.lineTo(lx+sw*8,0);g.stroke();g.beginPath();g.moveTo(lx+4,-14);g.lineTo(lx+4-sw*8,0);g.stroke();}
    g.beginPath();g.ellipse(0,-20,22,10,0,0,7);g.fill();g.beginPath();g.arc(24,-30,9,0,7);g.fill();
    if(k==='dog'){g.fillStyle='#5b3819';g.beginPath();g.ellipse(22,-36,4,7,-0.4,0,7);g.fill();g.beginPath();g.moveTo(-20,-24);g.lineTo(-32,-34+sw*6);g.stroke();}
    else{g.beginPath();g.moveTo(18,-36);g.lineTo(20,-46);g.lineTo(25,-38);g.moveTo(26,-38);g.lineTo(31,-46);g.lineTo(32,-35);g.fill();
      g.beginPath();g.moveTo(-20,-24);g.quadraticCurveTo(-34,-30,-30,-50+sw*4);g.stroke();
      g.strokeStyle='#8a4f1c';g.lineWidth=2;for(const sx of[-8,0,8]){g.beginPath();g.moveTo(sx,-29);g.lineTo(sx-3,-14);g.stroke();}}
    g.restore();return;}
  if(k==='chicken'){const bob=Math.abs(Math.sin(st*9))*3;g.strokeStyle='#d9a21b';g.lineWidth=3;
    g.beginPath();g.moveTo(-3,-14);g.lineTo(-3+sw*6,0);g.moveTo(4,-14);g.lineTo(4-sw*6,0);g.stroke();
    g.fillStyle='#fbf6ea';g.beginPath();g.ellipse(0,-24-bob,16,12,0,0,7);g.fill();g.beginPath();g.moveTo(-14,-28-bob);g.lineTo(-24,-40-bob);g.lineTo(-10,-34-bob);g.fill();
    g.beginPath();g.arc(13,-38-bob,8,0,7);g.fill();g.fillStyle='#d8352a';g.beginPath();g.arc(12,-47-bob,4,0,7);g.arc(17,-46-bob,3,0,7);g.fill();g.beginPath();g.ellipse(17,-33-bob,2.5,4,0,0,7);g.fill();
    g.fillStyle='#e8a21b';g.beginPath();g.moveTo(20,-40-bob);g.lineTo(27,-37-bob);g.lineTo(20,-35-bob);g.fill();g.fillStyle='#222';g.beginPath();g.arc(15,-40-bob,1.6,0,7);g.fill();
    g.restore();return;}
  const C={suit:['#3d3d44','#2a2a2e'],hanbok:['#f3e3e8','#d9607a'],student:['#22252e','#22252e'],granpa:['#e8e1cf','#cfc6ad'],postman:['#3f6b3a','#2f5229']}[k];
  g.strokeStyle='#2a1c12';g.lineWidth=6;g.beginPath();g.moveTo(-3,-38);g.lineTo(-3+sw*14,0);g.moveTo(3,-38);g.lineTo(3-sw*14,0);g.stroke();
  if(k==='hanbok'){g.fillStyle=C[1];g.beginPath();g.moveTo(-6,-60);g.lineTo(6,-60);g.lineTo(18,-6);g.lineTo(-18,-6);g.fill();g.fillStyle=C[0];g.fillRect(-10,-78,20,20);}
  else{g.fillStyle=C[0];g.fillRect(-11,-80,22,44);}
  g.strokeStyle=C[0];g.lineWidth=6;g.beginPath();g.moveTo(0,-74);g.lineTo(-sw*14,-50);g.stroke();
  g.fillStyle='#f0c9a0';g.beginPath();g.arc(0,-90,10,0,7);g.fill();
  if(k==='suit'){g.fillStyle='#1d1d1d';g.fillRect(-14,-99,28,4);g.fillRect(-9,-109,18,11);}
  else if(k==='hanbok'){g.fillStyle='#2a1c12';g.beginPath();g.arc(0,-93,10,Math.PI,0);g.fill();g.beginPath();g.arc(-9,-90,5,0,7);g.fill();}
  else if(k==='student'){g.fillStyle='#15171c';g.fillRect(-11,-102,22,8);g.fillRect(-11,-96,26,3);g.fillStyle='#7a5230';g.fillRect(-20,-70,9,22);}
  else if(k==='postman'){g.fillStyle=C[1];g.fillRect(-12,-102,24,9);g.fillRect(-12,-95,28,3);g.fillStyle='#7a5230';g.fillRect(-22,-64,14,18);g.strokeStyle='#5a3a20';g.lineWidth=2;g.beginPath();g.moveTo(-15,-64);g.lineTo(8,-80);g.stroke();}
  else{g.fillStyle='#e8e1cf';g.beginPath();g.arc(0,-94,8,Math.PI,0);g.fill();g.strokeStyle='#6b4a2b';g.lineWidth=3;g.beginPath();g.moveTo(14,-60);g.lineTo(18,0);g.stroke();g.fillStyle='#fff';g.fillRect(-4,-82,8,6);}
  g.restore();}

function rrect(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill();}
function drawTool(l,type){const side=l==='L'?1:-1,el=(performance.now()-hammer[l])/1000,IDLE=-0.75,HIT=0.3;
  const a=el<0.05?IDLE+(HIT-IDLE)*(el/0.05):el<0.2?HIT+(IDLE-HIT)*((el-0.05)/0.15):IDLE;
  g.save();g.translate(laneX[l]-76*side,hitY-60);g.scale(side,1);g.rotate(a);
  if(type==='hammer'){g.fillStyle='#6b4423';g.fillRect(0,-5,84,10);g.fillStyle='#3f4349';g.fillRect(72,-22,24,44);g.fillStyle='#5c6168';g.fillRect(72,-22,24,8);}
  else{g.fillStyle='#7a4f2a';rrect(-4,-6,38,12,6);g.fillStyle='#b98048';rrect(28,-14,74,28,14);g.fillStyle='rgba(255,230,190,.35)';rrect(34,-11,62,7,4);}
  g.restore();}

// ===== 스테이지 1: 대장간 못박기 =====
const S1={
  id:'nail',name:'대장간 못박기',icon:'🔨',desc:'못이 오면 탕! · 길거리 행인 세기',skill:'망치질',
  ranks:['🔨 명장 대장장이!','🔨 솜씨 좋은 일꾼','🔨 수습 대장장이'],bpm:96,tool:'hammer',
  bars:[[],[],[[0,'L'],[2,'L']],[[0,'R'],[2,'R']],[[0,'L'],[1,'R'],[2,'L'],[3,'R']],[[0,'L'],[2,'R']],
    [[0,'L'],[1,'L'],[2,'R']],[[0,'R'],[1,'R'],[2,'L']],[[0,'L'],[1,'R'],[2,'L'],[3,'R']],[[0,'B'],[2,'B']],
    [[0,'L'],[2,'L'],[3,'R']],[[0,'R'],[1,'L'],[2,'R'],[3,'L']],[[0,'L'],[1,'L'],[2,'R'],[3,'R']],[[0,'B'],[2,'L'],[3,'R']],
    [[0,'L'],[1,'R'],[2,'B']],[[0,'B']]],
  mel:[4,4,3,2,3,2,1,0,1,2,3,4,3,2,1,2,4,5,4,3,2,3,2,1,0,1,2,4,3,2,1,0],
  perc(t,bb,m){if(bb===0)drum(t,85,0.6);else if(bb===2)drum(t,135,0.4);tone(900,t+BEAT/2,0.04,'square',0.025);if(bb%2)tone(m/2,t,0.3,'sine',0.06);},
  hitSound(p){const t=ac.currentTime;noise(t,'bandpass',p?3200:2200,0.6,0.12);tone(p?2100:1600,t,0.18,'square',0.04);drum(t,110,0.5);},
  hitText:['탕!','좋아요'],
  spawn(){const n=3+Math.floor(Math.random()*5),kinds=['suit','hanbok','student','granpa'],slot=31/n,list=[];
    for(let i=0;i<n;i++)list.push({t:4+i*slot+rnd(0,Math.max(0,slot-4.6)),dur:4.4,dir:Math.random()<.5?1:-1,kind:kinds[Math.floor(Math.random()*4)]});
    list.push({t:rnd(8,30),dur:3.2,dir:Math.random()<.5?1:-1,kind:'dog'});
    const set=new Set([n]);for(const v of shuffle([n-2,n-1,n+1,n+2,n+3].filter(v=>v>0))){if(set.size>=4)break;set.add(v);}
    return{walkers:list,quiz:{q:'방금 길거리를 지나간 <u>사람</u>은<br>몇 명이었을까요?',sub:'(강아지는 빼고요 🐕)',
      options:[...set].sort((a,b)=>a-b).map(v=>({label:v+'명',value:v})),answer:n,answerText:n+'명'}};},
  drawScene(st){const sh=sceneH;let gr=g.createLinearGradient(0,0,0,sh);gr.addColorStop(0,'#f6dfae');gr.addColorStop(1,'#e9c27f');g.fillStyle=gr;g.fillRect(0,0,W,sh);
    g.fillStyle='#d4ad72';g.beginPath();g.moveTo(0,sh*0.35);g.quadraticCurveTo(W*0.25,sh*0.1,W*0.5,sh*0.3);g.quadraticCurveTo(W*0.75,sh*0.08,W,sh*0.3);g.lineTo(W,sh*0.6);g.lineTo(0,sh*0.6);g.fill();
    const shops=[['철물점','#8a5a3b'],['이발소','#5f7482'],['다 방','#7a4b4b'],['쌀 집','#7d6b3f']],bw=W/4;

const STAGES=[S1,S2];

// ===== 채보 =====
function buildNotes(){notes=[];stage.bars.forEach((bar,i)=>bar.forEach(([b,l])=>{const t=(i*4+b)*BEAT;
  if(l==='B'){notes.push({t,lane:'L'});notes.push({t,lane:'R'});}else notes.push({t,lane:l});}));}

// ===== 입력 =====
function hit(lane){if(state!=='play')return;hammer[lane]=performance.now();const st=songT();let best=null,bd=9;
  for(const n of notes){if(n.lane!==lane||n.done)continue;const d=st-n.t;if(Math.abs(d)<Math.abs(bd)){bd=d;best=n;}}
  if(best&&Math.abs(bd)<=WIN_GOOD){best.done=true;const p=Math.abs(bd)<=WIN_PERF;best.res=p?'perfect':'good';score[best.res]++;errs.push(Math.abs(bd));stage.hitSound(p);
    pop(laneX[lane],hitY-90,stage.hitText[p?0:1],p?'#ffe27a':'#fff');for(let i=0;i<10;i++)sparks.push({x:laneX[lane],y:hitY-30,vx:rnd(-3,3),vy:rnd(-5,-1),life:1,c:stage.id==='nail'});}
  else{whiff();score.whiff++;}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();hit(e.clientX<W/2?'L':'R');});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if('fdsa'.includes(k))hit('L');else if('jkl;'.includes(k))hit('R');});
function pop(x,y,text,color){pops.push({x,y,text,color,t:performance.now()});}

// ===== 루프 =====
function drawFx(st){const t=performance.now();
  sparks=sparks.filter(s=>s.life>0);for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vy+=0.25;s.life-=0.04;g.fillStyle=s.c?`rgba(255,${180+Math.random()*60|0},60,${s.life})`:`rgba(245,240,225,${s.life})`;g.fillRect(s.x,s.y,4,4);}
  pops=pops.filter(p=>t-p.t<650);for(const p of pops){const k=(t-p.t)/650;g.globalAlpha=1-k;g.fillStyle=p.color;g.font=`bold ${34+k*8}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.strokeStyle='#2b1d12';g.lineWidth=5;g.strokeText(p.text,p.x,p.y-k*30);g.fillText(p.text,p.x,p.y-k*30);g.globalAlpha=1;}
  if(state==='play'){const b=Math.floor(st/BEAT);
    if(st<8*BEAT){const txt=b<4?'준비~':['하나','둘','셋','넷'][b-4];g.fillStyle='#ffe9b8';g.strokeStyle='#2b1d12';g.lineWidth=6;g.font='bold 46px sans-serif';g.textAlign='center';g.textBaseline='middle';g.strokeText(txt,W/2,(sceneH+hitY)/2);g.fillText(txt,W/2,(sceneH+hitY)/2);}
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,6);g.fillStyle='#e0892b';g.fillRect(0,0,W*Math.min(1,Math.max(0,st/END_T)),6);}}
function loop(){const s=stage||S1,st=state==='play'?songT():0;
  if(state==='play'){for(const n of notes){if(!n.done&&st-n.t>WIN_GOOD){n.done=true;n.res='miss';score.miss++;pop(laneX[n.lane],hitY-90,'아이고!','#ff9a7a');}}if(st>END_T)endGame();}
  s.drawScene(st);const top=sceneH,spd=(hitY-top)/LEAD,bw=Math.min(W*0.4,170);s.drawLanes(st,top,bw,spd);
  g.setLineDash([10,8]);g.strokeStyle='rgba(255,230,160,.7)';g.lineWidth=3;g.beginPath();g.moveTo(0,hitY);g.lineTo(W,hitY);g.stroke();g.setLineDash([]);
  if(stage)for(const n of notes){const y=hitY-(n.t-st)*spd;if(y<top-40||y>H+40)continue;s.drawNote(laneX[n.lane],y,n.res);}
  for(const l of['L','R'])drawTool(l,s.tool);
  g.font='bold 18px sans-serif';g.textAlign='center';g.textBaseline='alphabetic';g.lineWidth=4;g.strokeStyle='rgba(43,29,18,.75)';g.fillStyle='#fbeed7';
  for(const [l,t] of [['L','왼손'],['R','오른손']]){g.strokeText(t,laneX[l],H-22);g.fillText(t,laneX[l],H-22);}
  drawFx(st);requestAnimationFrame(loop);}

// ===== 흐름 =====
const $=id=>document.getElementById(id);
const hideAll=()=>['startOv','quizOv','resultOv','cardOv','calibOv','profOv','recOv'].forEach(i=>$(i).classList.add('hidden'));
$('stageList').innerHTML=STAGES.map((s,i)=>`<button data-i="${i}">${s.icon} ${i+1}. ${s.name}<small>${s.desc}</small></button>`).join('');
$('stageList').addEventListener('click',e=>{const b=e.target.closest('button');if(b)startGame(STAGES[+b.dataset.i]);});
function startGame(s){stage=s;BEAT=60/s.bpm;END_T=15*4*BEAT+2.2;
  ensureAudio();buildNotes();const sp=s.spawn();walkers=sp.walkers;quiz=sp.quiz;score={perfect:0,good:0,miss:0,whiff:0};errs=[];pops=[];sparks=[];
  start=ac.currentTime+0.6;scheduleMusic(s.mel,s.perc.bind(s));state='play';hideAll();}
function endGame(){state='quiz';$('qText').innerHTML=quiz.q;$('qSub').textContent=quiz.sub;const box=$('opts');box.innerHTML='';
  quiz.options.forEach(o=>{const b=document.createElement('button');b.textContent=o.label;b.onclick=()=>showResult(o.value);box.appendChild(b);});
  $('quizOv').classList.remove('hidden');}
function showResult(v){state='result';hideAll();const total=notes.length,acc=Math.max(0,Math.round((score.perfect+score.good*0.7)/total*100)-Math.max(0,score.whiff-5)),ok=v===quiz.answer;
  const rank=stage.ranks[acc>=85?0:acc>=60?1:2],age=quickAge(acc),P=DATA.profile||{},real=P.age||0,diff=real?real-age:0;
  lastResult={acc,ok,rank,stage,age,real,diff,nick:P.nick||''};const newBest=record(lastResult);
  const ageLine=!real?'':diff>0?`<br><span style="font-size:22px;color:#9be37a">실제 ${real}세보다 ${diff}살 젊어요!</span>`:diff===0?'<br><span style="font-size:22px">실제 나이랑 똑같아요!</span>':'<br><span style="font-size:20px">다음 판엔 더 젊어질 거예요!</span>';
  $('rTitle').innerHTML=`${rank}<br><span style="font-size:22px;color:#fbeed7">⚡ 재미로 보는 순발력 나이</span><br><span style="font-size:54px;color:#ffd58a">${age}세</span>${ageLine}`;
  $('rQuiz').innerHTML=ok?`<span class="ok">⭕ 정답! (${quiz.answerText})</span>`:`<span class="no">❌ 아쉬워요! 정답은 ${quiz.answerText}</span>`;
  $('rScore').innerHTML=`${stage.skill} 정확도 <b>${acc}점</b><br>${stage.hitText[0]} ${score.perfect} · 좋아요 ${score.good} · 아이고 ${score.miss}${score.whiff>5?` · 헛손질 ${score.whiff}`:''}`;
  $('rMsg').textContent=(newBest?'🎉 새 최고 기록! ':'')+(ok&&acc>=85?'손도 눈도 아주 좋으시네요!':ok?'눈썰미가 대단하세요! 손은 조금 더~':acc>=85?`${stage.skill}은 완벽! 다음엔 배경도 살펴보세요`:'한 판 더 하면 금방 늘어요!');
  $('resultOv').classList.remove('hidden');}
// 재미용: 박자 오차(평균)와 정확도로 계산, 20~75세로 제한 (의학적 의미 없음)
function quickAge(acc){if(!errs.length)return 75;const ms=errs.reduce((a,b)=>a+b,0)/errs.length*1000;
  return Math.round(Math.min(75,Math.max(20,20+ms*0.35+(100-acc)*0.4)));}
$('againBtn').onclick=()=>startGame(stage);

// ===== 박자 맞추기 (오디오 지연 보정) =====
const CAL_BPM=100,CAL_N=12,CAL_SKIP=4;let calTaps=[],calStart=0,calTimer=null;
function showOffset(){$('offsetNow').textContent=OFFSET?`현재 보정값: ${OFFSET>0?'+':''}${OFFSET.toFixed(2)}초`:'';}
showOffset();
$('calibOpen').onclick=()=>{hideAll();$('calibMsg').textContent='';$('calibOv').classList.remove('hidden');state='calib';};
$('calibClose').onclick=()=>{clearTimeout(calTimer);goHome();};
$('calibReset').onclick=()=>{OFFSET=0;try{localStorage.removeItem('gh_offset');}catch(e){}$('calibMsg').textContent='보정값을 0으로 되돌렸어요';};
$('calibStart').onclick=()=>{ensureAudio();calTaps=[];const b=60/CAL_BPM;calStart=ac.currentTime+0.5;
  for(let i=0;i<CAL_N;i++)tone(i%4===0?1500:1150,calStart+i*b,0.07,'square',0.12);
  $('calibMsg').textContent='소리에 맞춰 톡! 톡!';clearTimeout(calTimer);calTimer=setTimeout(finishCal,(0.5+CAL_N*b+0.6)*1000);};
$('calibPad').addEventListener('pointerdown',e=>{e.preventDefault();if(!ac||!calStart)return;calTaps.push(ac.currentTime-(ac.outputLatency||0)-calStart);
  e.currentTarget.animate([{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:120});});
function finishCal(){const b=60/CAL_BPM,d=[];
  for(const t of calTaps){const i=Math.round(t/b);if(i<CAL_SKIP||i>=CAL_N)continue;const e=t-i*b;if(Math.abs(e)<0.35)d.push(e);}
  calStart=0;
  if(d.length<4){$('calibMsg').textContent='톡 누른 횟수가 부족해요. 다시 해볼까요?';return;}
  d.sort((a,b)=>a-b);const med=d[Math.floor(d.length/2)];OFFSET=Math.max(-0.3,Math.min(0.3,Math.round(med*100)/100));
  try{localStorage.setItem('gh_offset',String(OFFSET));}catch(e){}
  $('calibMsg').textContent=Math.abs(OFFSET)<0.03?'박자가 딱 맞아요! 보정 필요 없어요 👍':`보정 완료! (${OFFSET>0?'+':''}${OFFSET.toFixed(2)}초) 이제 판정이 맞춰져요`;}
$('menuBtn').onclick=goHome;

// ===== 공유 카드 =====
function makeCard(r){const c=document.createElement('canvas');c.width=1080;c.height=1080;const x=c.getContext('2d');
  x.fillStyle='#2b1d12';x.fillRect(0,0,1080,1080);x.fillStyle='#f6dfae';x.fillRect(40,40,1000,1000);
  x.fillStyle='#e9c27f';x.fillRect(40,700,1000,340);x.strokeStyle='#5a3b22';x.lineWidth=10;x.strokeRect(40,40,1000,1000);
  x.textAlign='center';x.textBaseline='middle';x.fillStyle='#7a2e1e';x.font='bold 64px sans-serif';x.fillText('골목한판',540,140);
  x.fillStyle='#5a3b22';x.font='bold 46px sans-serif';x.fillText(`${r.stage.icon} ${r.stage.name}`,540,230);
  x.fillStyle='#2b1d12';x.font='bold 54px sans-serif';x.fillText((r.nick?r.nick+'님 · ':'')+r.rank.replace(/^\S+\s/,''),540,315);
  x.font='bold 42px sans-serif';x.fillText('⚡ 내 순발력 나이',540,395);
  x.fillStyle='#e0892b';x.font='bold 140px sans-serif';x.fillText(r.age+'세',540,495);
  if(r.diff>0){x.fillStyle='#3c7a2a';x.font='bold 44px sans-serif';x.fillText(`실제 ${r.real}세보다 ${r.diff}살 젊어요!`,540,585);}
  x.fillStyle='#5a3b22';x.font='bold 38px sans-serif';x.fillText(`${r.stage.skill} 정확도 ${r.acc}점`,540,r.diff>0?640:600);
  x.font='26px sans-serif';x.fillText('(재미로 보는 숫자예요)',540,r.diff>0?678:645);
  x.fillStyle=r.ok?'#3c7a2a':'#a0442f';x.font='bold 54px sans-serif';x.fillText(r.ok?'⭕ 눈썰미 퀴즈 정답!':'❌ 눈썰미 퀴즈는 아깝게…',540,790);
  x.fillStyle='#2b1d12';x.font='bold 44px sans-serif';x.fillText('나도 한 판 해볼까? 👇',540,900);
  x.font='36px sans-serif';x.fillText(SITE.replace('https://',''),540,965);return c;}
async function share(){if(!lastResult)return;const c=makeCard(lastResult),text=shareText();
  try{const blob=await new Promise(res=>c.toBlob(res,'image/png'));const file=new File([blob],'golmok-hanpan.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:text+'\n'+SITE});return;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  $('cardImg').src=c.toDataURL('image/png');$('copyMsg').textContent='';hideAll();$('cardOv').classList.remove('hidden');}
$('shareBtn').onclick=share;
$('cardClose').onclick=()=>{hideAll();$('resultOv').classList.remove('hidden');};
$('copyBtn').onclick=async()=>{const text=shareText()+'\n'+SITE;
  try{await navigator.clipboard.writeText(text);$('copyMsg').textContent='복사됐어요! 카톡에 붙여넣기 하세요';}catch(e){$('copyMsg').textContent=SITE;}};

function shareText(){const r=lastResult;return `[골목한판] ${r.stage.name} — 내 순발력 나이 ${r.age}세!${r.diff>0?` (실제보다 ${r.diff}살 젊음)`:''} 나도 한 판 해볼까?`;}

// ===== 프로필 · 기록 · 오늘의 한판 (기기 저장) =====
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dstr(new Date());}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dstr(d);}
function dailyStage(){const d=new Date(),n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);return STAGES[n%STAGES.length];}
function streakNow(){return(DATA.lastDate===today()||DATA.lastDate===yesterday())?DATA.streak:0;}
function record(r){const t=today();if(DATA.lastDate!==t){DATA.streak=DATA.lastDate===yesterday()?DATA.streak+1:1;DATA.lastDate=t;}
  DATA.plays++;DATA.history.push({d:t,s:r.stage.id,acc:r.acc,age:r.age,ok:r.ok});if(DATA.history.length>60)DATA.history.shift();
  const b=DATA.best[r.stage.id],newBest=!!b&&r.acc>b.acc;DATA.best[r.stage.id]=b?{acc:Math.max(b.acc,r.acc),age:Math.min(b.age,r.age)}:{acc:r.acc,age:r.age};save();return newBest;}
function goHome(){state='idle';hideAll();renderStart();$('startOv').classList.remove('hidden');}
function renderStart(){const p=DATA.profile;$('greet').textContent=p&&p.nick?`${p.nick}님, 반가워요!`:'추억의 골목에서 한 판!';
  const s=streakNow();$('streak').textContent=s?`🔥 ${s}일 연속 출석 중`:'';
  const ds=dailyStage(),done=DATA.lastDate===today();
  $('dailyBtn').innerHTML=done?`✅ 오늘의 한판 완료!<small>${ds.icon} ${ds.name} · 또 해도 좋아요</small>`:`⭐ 오늘의 한판<small>${ds.icon} ${ds.name}</small>`;showOffset();}
$('dailyBtn').onclick=()=>startGame(dailyStage());
// 프로필
let gSel='';
function openProfile(){const p=DATA.profile||{};$('pNick').value=p.nick||'';$('pAge').value=p.age||'';gSel=p.gender||'';
  [...$('pGender').children].forEach(b=>b.classList.toggle('on',p.gender!==undefined&&b.dataset.g===gSel));hideAll();$('profOv').classList.remove('hidden');}
$('profOpen').onclick=openProfile;
$('pGender').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;gSel=b.dataset.g;[...$('pGender').children].forEach(x=>x.classList.toggle('on',x===b));});
const ageStep=d=>{const v=parseInt($('pAge').value)||65;$('pAge').value=Math.max(10,Math.min(110,v+d));};
$('ageMinus').onclick=()=>ageStep(-1);$('agePlus').onclick=()=>ageStep(1);
$('profSave').onclick=()=>{const a=parseInt($('pAge').value);DATA.profile={nick:$('pNick').value.trim().slice(0,10),age:a>=10&&a<=110?a:0,gender:gSel};save();goHome();};
$('profSkip').onclick=()=>{DATA.asked=true;save();goHome();};
// 기록
function renderRec(){const h=DATA.history;
  if(!h.length){$('recBody').innerHTML='<p style="text-align:center">아직 기록이 없어요.<br>한 판 해볼까요?</p>';return;}
  const bestAge=Math.min(...h.map(x=>x.age));
  let html=`<div class="sum"><div><b>${DATA.plays}</b>판</div><div><b>${streakNow()}</b>일 연속</div><div><b>${bestAge}세</b>최고 순발력</div></div>`;
  html+='<h3>판별 최고 기록</h3>'+STAGES.map(s=>{const b=DATA.best[s.id];return `<div class="rrow"><span>${s.icon} ${s.name}</span><span>${b?`${b.acc}점 · ${b.age}세`:'-'}</span></div>`;}).join('');
  html+='<h3>최근 순발력 나이 <span class="sub">(막대가 짧을수록 젊어요)</span></h3>'+h.slice(-10).map(x=>`<div class="bar"><span class="bl">${x.d.slice(5).replace('-','/')}</span><span class="bt"><i style="width:${Math.round(x.age/75*100)}%"></i></span><span class="bv">${x.age}세</span></div>`).join('');
  $('recBody').innerHTML=html;}
$('recOpen').onclick=()=>{renderRec();hideAll();$('recOv').classList.remove('hidden');};
$('recClose').onclick=goHome;
// 첫 방문이면 프로필부터
if(!DATA.profile&&!DATA.asked)openProfile();else renderStart();

requestAnimationFrame(loop);
}
</script>
</body>
</html>

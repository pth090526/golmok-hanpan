<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>골목한판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2b1d12;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;background:#fbf3e2;color:#2b1d12;text-align:center;padding:24px 20px;box-sizing:border-box;overflow-y:auto;font-family:'Noto Sans KR',-apple-system,"Apple SD Gothic Neo",sans-serif}
.hidden{display:none}
h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:42px;margin:0 0 4px;color:#2b1d12}
h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:32px;line-height:1.2;margin:0 0 10px;color:#2b1d12}
p{font-size:21px;line-height:1.55;margin:6px 0}
.big{font-size:24px;font-weight:700}
.sub{font-size:16px;color:#6b5236}
button{font-size:24px;font-weight:900;padding:15px 28px;border-radius:16px;border:none;background:#2b1d12;color:#fbeed7;margin:10px 6px 0;min-width:140px;box-shadow:0 4px 0 #120b06;font-family:inherit;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #120b06}
button.alt{background:#fff;color:#2b1d12;box-shadow:0 3px 0 #ead7b0;border:2px solid #ead7b0;font-weight:700}
button.share{background:#f2c94c;color:#3b2a10;box-shadow:0 4px 0 #a5821d}
button:focus-visible{outline:3px solid #d9772b;outline-offset:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;width:min(420px,90vw)}
.opts button{margin:0;font-size:26px;padding:20px 6px;min-width:0;background:#fff;color:#2b1d12;border:2px solid #ead7b0;box-shadow:0 4px 0 #ead7b0}
.hand{display:flex;gap:12px;justify-content:center;margin:10px 0 0}
.hand div{background:#fff8ea;border:2px solid #ead7b0;border-radius:14px;padding:10px 14px;font-size:18px}
.ok{color:#2f6b2a}.no{color:#b4441a}
.small{font-size:18px;padding:10px 18px;min-width:0}
.fl{display:block;width:min(380px,90vw);text-align:left;font-size:20px;font-weight:700;margin:14px 0 0}
.fl input{display:block;width:100%;box-sizing:border-box;font-size:26px;padding:12px 14px;border-radius:12px;border:2px solid #d9c29a;background:#fff;color:#2b1d12;margin-top:6px;font-family:inherit}
.agebox{display:flex;gap:8px;align-items:center;margin-top:6px}.agebox input{margin:0;text-align:center}.agebox button{margin:0;min-width:64px;padding:12px 0;font-size:30px}
.seg{display:flex;gap:8px;margin-top:6px}.seg button{flex:1;margin:0;min-width:0;font-size:19px;padding:12px 0;background:#fff;color:#2b1d12;border:2px solid #ead7b0;box-shadow:0 3px 0 #ead7b0;font-weight:700}
.seg button.on{background:#2b1d12;color:#ffd58a;border-color:#2b1d12;box-shadow:0 3px 0 #120b06}
.sect{width:min(380px,90vw);text-align:left;font-size:18px;font-weight:900;color:#8a4a1c;margin:26px 0 0;padding-top:16px;border-top:2px dashed #ead7b0}
.rec{width:min(420px,92vw);text-align:left}.rec h3{font-size:19px;color:#8a4a1c;margin:18px 0 6px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sum div{background:#fff8ea;border:2px solid #ead7b0;border-radius:14px;padding:10px 4px;font-size:15px;color:#6b5236}.sum b{display:block;font-size:26px;color:#b4441a}
.rrow{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid rgba(43,29,18,.12);font-size:18px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:16px}.bl{width:48px;color:#6b5236}.bt{flex:1;height:14px;background:#ead7b0;border-radius:7px;overflow:hidden}.bt i{display:block;height:100%;background:#d9772b}.bv{width:44px;text-align:right;font-weight:700}
.rcard{background:#fff;border:2px solid #ead7b0;border-radius:22px;box-shadow:0 5px 0 #ead7b0;padding:18px 20px;width:min(380px,90vw);box-sizing:border-box}
body.bigtext .hbody,body.bigtext .ov>*{zoom:1.12}
body.bigtext .hbody{max-width:calc(100vw / 1.12)}
body.bigtext .ov .fl,body.bigtext .ov .sect,body.bigtext .ov .rcard,body.bigtext .ov .opts,body.bigtext .ov .rec{width:min(380px,calc(88vw / 1.12))}
body.bigtext .ov #calibPad,body.bigtext .ov #cardImg{width:min(300px,calc(80vw / 1.12))}
/* 홈 (A안) */
.home{position:fixed;inset:0;display:flex;flex-direction:column;background:#fbf3e2;color:#2b1d12;font-family:'Noto Sans KR',-apple-system,"Apple SD Gothic Neo",sans-serif}
.home.hidden{display:none}
.hscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.banner{position:relative;height:250px;background:#f1d9a6;overflow:hidden}.banner>svg{position:absolute;inset:0;width:100%;height:250px}
.btop{position:absolute;left:20px;right:20px;top:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.logo{font-family:'Black Han Sans',sans-serif;font-size:30px;line-height:1.1}
.hello{font-size:17px;font-weight:700;color:#3b2a1c}
.chip{display:flex;align-items:center;gap:6px;background:#2b1d12;color:#ffd58a;border-radius:999px;padding:8px 14px;font-size:16px;font-weight:700;white-space:nowrap}.chip:empty{display:none}
.hbody{max-width:480px;margin:-34px auto 0;padding:0 18px 20px;position:relative;display:flex;flex-direction:column;gap:12px}
.today{background:#f2c94c;border-radius:22px;padding:18px 20px;box-shadow:0 6px 0 #a5821d;display:flex;flex-direction:column;gap:12px}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;color:#5a3f0c}
.tpill{font-size:14px;background:rgba(255,255,255,.5);border-radius:999px;padding:3px 10px}
.tmain{display:flex;align-items:center;gap:14px;text-align:left}
.ticon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.tname{font-family:'Black Han Sans',sans-serif;font-size:28px;line-height:1.15}
.tdesc{font-size:16px;color:#4a3410}
.home .tbtn{margin:0;width:100%;height:58px;border-radius:16px;background:#2b1d12;color:#fbeed7;font-size:22px;font-weight:900;box-shadow:0 4px 0 #120b06;padding:0}
.stats{display:flex;gap:10px}.stat{flex:1;background:#fff8ea;border:2px solid #ead7b0;border-radius:16px;padding:7px 12px;display:flex;flex-direction:column;text-align:left;font-size:14px;color:#6b5236}
.stat b{font-size:26px;font-weight:900;line-height:1.2}.c1{color:#b4441a}.c2{color:#2f6b2a}
.htitle{font-size:18px;font-weight:900;text-align:left}
.slist{display:flex;flex-direction:column;gap:10px}
.home .srow{margin:0;display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:8px 14px;color:#2b1d12;box-shadow:0 3px 0 #ead7b0;text-align:left;min-width:0;width:100%;font-family:inherit}
.srow .si{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.srow .sn{display:block;font-size:19px;font-weight:700}.srow .sd{display:block;font-size:15px;color:#6b5236;font-weight:400}
.hint{font-size:15px;color:#6b5236;text-align:center;line-height:1.5}
.tabs{flex:none;min-height:72px;background:#2b1d12;display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.home .tabs button{margin:0;background:none;box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:#cdb89a;font-size:15px;font-weight:500;padding:6px 10px;min-width:72px}
.home .tabs button.on{color:#ffd58a;font-weight:700}
#cardImg{width:min(320px,80vw);border-radius:12px;margin:10px 0;box-shadow:0 6px 20px rgba(0,0,0,.4);-webkit-touch-callout:default;user-select:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="startOv" class="home">
  <div class="hscroll">

        <rect x="140" y="128" width="104" height="72" fill="#7d6b3f"/><rect x="136" y="122" width="112" height="8" fill="#4a3424"/>
        <rect x="148" y="100" width="88" height="24" fill="#f6e7c8" stroke="#4a3424" stroke-width="2"/>
        <text x="192" y="118" text-anchor="middle" font-family="Black Han Sans" font-size="16" fill="#7a2e1e">다듬이방</text>
        <rect x="160" y="146" width="30" height="24" fill="#e9d9b0"/><rect x="200" y="146" width="30" height="24" fill="#e9d9b0"/>
        <rect x="268" y="118" width="110" height="82" fill="#5f7482"/><rect x="264" y="112" width="118" height="8" fill="#4a3424"/>
        <rect x="276" y="90" width="94" height="24" fill="#f6e7c8" stroke="#4a3424" stroke-width="2"/>
        <text x="323" y="108" text-anchor="middle" font-family="Black Han Sans" font-size="16" fill="#7a2e1e">정류장</text>
        <rect x="252" y="40" width="6" height="160" fill="#5a3b22"/><rect x="238" y="50" width="34" height="4" fill="#5a3b22"/>
        <path d="M-200 64 Q120 84 238 52 M272 52 Q330 72 590 60" stroke="#3b2a1c" stroke-width="1.2" fill="none" opacity=".6"/>
        <rect x="290" y="166" width="74" height="28" rx="12" fill="#2f7f86"/><rect x="290" y="166" width="74" height="12" rx="6" fill="#e9dfc4"/>
        <circle cx="304" cy="196" r="6" fill="#222"/><circle cx="350" cy="196" r="6" fill="#222"/>
      </svg>
      <div class="btop"><div><div class="logo">골목한판</div><div class="hello" id="greet"></div></div><div class="chip" id="streak"></div></div>
    </div>
    <div class="hbody">
      <div class="today">
        <div class="trow"><span id="todayDate"></span><span class="tpill">하루 한 판</span></div>
        <div class="tmain"><div class="ticon" id="todayIcon"></div><div><div class="tname" id="todayName"></div><div class="tdesc" id="todayDesc"></div></div></div>

  <nav class="tabs">

  </nav>
</div>

<div id="profOv" class="ov hidden">
  <h2 id="profTitle">반가워요!</h2>
  <p class="sub">회원가입 없이, 이 휴대폰에만 저장돼요</p>
  <label class="fl">별명<input id="pNick" maxlength="10" placeholder="예: 안양 김씨" autocomplete="off"></label>
  <div class="fl">나이<div class="agebox"><button id="ageMinus" class="alt">−</button><input id="pAge" type="number" inputmode="numeric" min="10" max="110" placeholder="65"><button id="agePlus" class="alt">＋</button></div></div>
  <div class="fl">성별 <span class="sub">(선택)</span><div class="seg" id="pGender"><button data-g="m">남자</button><button data-g="f">여자</button><button data-g="">안 알려줌</button></div></div>
  <button id="profSave" style="margin-top:20px">저장하고 시작</button>

  <div class="fl">소리 크기<div class="seg" id="sVol"><button data-v="0.5">작게</button><button data-v="1">보통</button><button data-v="1.6">크게</button></div></div>

<script>
{
const SITE='https://pth090526.github.io/golmok-hanpan/';
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr,sceneH,hitY,laneX;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  sceneH=Math.round(H*0.4);hitY=Math.round(H-Math.max(110,H*0.16));laneX={L:W*0.28,R:W*0.72};}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LEAD=1.9,WIN_PERF=0.08,WIN_GOOD=0.18;
let ac=null,start=0,BEAT=0.625,END_T=40,notes=[],walkers=[],pops=[],sparks=[],state='idle',score,hammer={L:-9,R:-9},noiseBuf,stage=null,quiz=null,lastResult=null,errs=[];
let DATA={profile:null,asked:false,history:[],best:{},streak:0,lastDate:'',plays:0,settings:{vol:1,big:0,vib:1}};let master=null;
try{const v=JSON.parse(localStorage.getItem('gh_data'));if(v&&typeof v==='object')DATA=Object.assign(DATA,v);}catch(e){}
function save(){try{localStorage.setItem('gh_data',JSON.stringify(DATA));}catch(e){}}
let OFFSET=0;try{OFFSET=parseFloat(localStorage.getItem('gh_offset'))||0;}catch(e){}
function now(){return ac?ac.currentTime-(ac.outputLatency||0)-start:-3;}
function songT(){return now()-OFFSET;}
function ensureAudio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;master=ac.createGain();master.gain.value=DATA.settings.vol;master.connect(ac.destination);}ac.resume();}

// ===== 사운드 =====
function env(node,t,v,d){const gn=ac.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.008);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);node.connect(gn).connect(master||ac.destination);}
function tone(f,t,d,type,v){const o=ac.createOscillator();o.type=type||'triangle';o.frequency.value=f;env(o,t,v||0.12,d);o.start(t);o.stop(t+d+0.05);}
function drum(t,f,v){const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*0.5,t+0.18);env(o,t,v,0.28);o.start(t);o.stop(t+0.32);}
function noise(t,type,freq,v,d){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=3;s.connect(f);env(f,t,v,d);s.start(t);s.stop(t+d+0.03);}
function whiff(){noise(ac.currentTime,'highpass',4000,0.08,0.08);}
const SC=[261.6,293.7,329.6,392.0,440.0,523.3,587.3];
function scheduleMusic(mel,perc){
  for(let b=0;b<64;b++){const t=start+b*BEAT,bar=Math.floor(b/4),bb=b%4;
    if(bar<2){tone(bb===0?1500:1150,t,0.07,'square',0.07);continue;}
    if(bar===15){if(bb===0){tone(SC[0],t,1.6,'triangle',0.16);tone(SC[0]/2,t,1.6,'sine',0.12);drum(t,85,0.7);}continue;}
    const m=SC[mel[(b-8)%mel.length]];tone(m,t,0.42,'triangle',0.11);
    perc(t,bb,m);}
}

// ===== 그리기 도구 =====
function walkerX(p,st,x0,x1){const k=(st-p.t)/p.dur;if(k<0||k>1)return null;return p.dir>0?x0+k*(x1-x0):x1-k*(x1-x0);}
function drawWalker(x,y,p,st,sc){const s=(sceneH/210)*(sc||1),sw=p.still?0:Math.sin(st*11)*0.5;g.save();g.translate(x,y);g.scale(s*p.dir,s);g.lineCap='round';
  const k=p.kind;

const STAGES=[S1,S2,S3];

// ===== 채보 =====
function buildNotes(){notes=[];stage.bars.forEach((bar,i)=>bar.forEach(([b,l])=>{const t=(i*4+b)*BEAT;
  if(l==='B'){notes.push({t,lane:'L'});notes.push({t,lane:'R'});}else notes.push({t,lane:l});}));}

// ===== 입력 =====
function hit(lane){if(state!=='play')return;hammer[lane]=performance.now();const st=songT();let best=null,bd=9;
  for(const n of notes){if(n.lane!==lane||n.done)continue;const d=st-n.t;if(Math.abs(d)<Math.abs(bd)){bd=d;best=n;}}
  if(best&&Math.abs(bd)<=WIN_GOOD){best.done=true;const p=Math.abs(bd)<=WIN_PERF;best.res=p?'perfect':'good';score[best.res]++;errs.push(Math.abs(bd));if(DATA.settings.vib)try{navigator.vibrate&&navigator.vibrate(p?35:20);}catch(e){}stage.hitSound(p);
    pop(laneX[lane],hitY-90,stage.hitText[p?0:1],p?'#ffe27a':'#fff');for(let i=0;i<10;i++)sparks.push({x:laneX[lane],y:hitY-30,vx:rnd(-3,3),vy:rnd(-5,-1),life:1,c:stage.id==='nail'});}
  else{whiff();score.whiff++;}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();hit(e.clientX<W/2?'L':'R');});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if('fdsa'.includes(k))hit('L');else if('jkl;'.includes(k))hit('R');});
function pop(x,y,text,color){pops.push({x,y,text,color,t:performance.now()});}

// ===== 루프 =====
function drawFx(st){const t=performance.now();
  sparks=sparks.filter(s=>s.life>0);for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vy+=0.25;s.life-=0.04;g.fillStyle=s.c?`rgba(255,${180+Math.random()*60|0},60,${s.life})`:`rgba(245,240,225,${s.life})`;g.fillRect(s.x,s.y,4,4);}
  pops=pops.filter(p=>t-p.t<650);for(const p of pops){const k=(t-p.t)/650;g.globalAlpha=1-k;g.fillStyle=p.color;g.font=`bold ${34+k*8}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.strokeStyle='#2b1d12';g.lineWidth=5;g.strokeText(p.text,p.x,p.y-k*30);g.fillText(p.text,p.x,p.y-k*30);g.globalAlpha=1;}
  if(state==='play'){const b=Math.floor(st/BEAT);
    if(st<8*BEAT){const txt=b<4?'준비~':['하나','둘','셋','넷'][b-4];g.fillStyle='#ffe9b8';g.strokeStyle='#2b1d12';g.lineWidth=6;g.font='bold 46px sans-serif';g.textAlign='center';g.textBaseline='middle';g.strokeText(txt,W/2,(sceneH+hitY)/2);g.fillText(txt,W/2,(sceneH+hitY)/2);}
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,6);g.fillStyle='#e0892b';g.fillRect(0,0,W*Math.min(1,Math.max(0,st/END_T)),6);}}
function loop(){const s=stage||S1,st=state==='play'?songT():0;
  if(state==='play'){for(const n of notes){if(!n.done&&st-n.t>WIN_GOOD){n.done=true;n.res='miss';score.miss++;pop(laneX[n.lane],hitY-90,'아이고!','#ff9a7a');}}if(st>END_T)endGame();}
  s.drawScene(st);const top=sceneH,spd=(hitY-top)/LEAD,bw=Math.min(W*0.4,170);s.drawLanes(st,top,bw,spd);
  g.setLineDash([10,8]);g.strokeStyle='rgba(255,230,160,.7)';g.lineWidth=3;g.beginPath();g.moveTo(0,hitY);g.lineTo(W,hitY);g.stroke();g.setLineDash([]);
  if(stage)for(const n of notes){const y=hitY-(n.t-st)*spd;if(y<top-40||y>H+40)continue;s.drawNote(laneX[n.lane],y,n.res);}
  for(const l of['L','R'])drawTool(l,s.tool);
  g.font='bold 18px sans-serif';g.textAlign='center';g.textBaseline='alphabetic';g.lineWidth=4;g.strokeStyle='rgba(43,29,18,.75)';g.fillStyle='#fbeed7';
  for(const [l,t] of [['L','왼손'],['R','오른손']]){g.strokeText(t,laneX[l],H-22);g.fillText(t,laneX[l],H-22);}
  drawFx(st);requestAnimationFrame(loop);}

// ===== 흐름 =====
const $=id=>document.getElementById(id);
const hideAll=()=>['startOv','quizOv','resultOv','cardOv','calibOv','profOv','recOv'].forEach(i=>$(i).classList.add('hidden'));
$('stageList').addEventListener('click',e=>{const b=e.target.closest('button');if(b)startGame(STAGES[+b.dataset.i]);});
function startGame(s){stage=s;BEAT=60/s.bpm;END_T=15*4*BEAT+2.2;
  ensureAudio();buildNotes();const sp=s.spawn();walkers=sp.walkers;quiz=sp.quiz;score={perfect:0,good:0,miss:0,whiff:0};errs=[];pops=[];sparks=[];
  start=ac.currentTime+0.6;scheduleMusic(s.mel,s.perc.bind(s));state='play';hideAll();}
function endGame(){state='quiz';$('qText').innerHTML=quiz.q;$('qSub').textContent=quiz.sub;const box=$('opts');box.innerHTML='';
  quiz.options.forEach(o=>{const b=document.createElement('button');b.textContent=o.label;b.onclick=()=>showResult(o.value);box.appendChild(b);});
  $('quizOv').classList.remove('hidden');}
function showResult(v){state='result';hideAll();const total=notes.length,acc=Math.max(0,Math.round((score.perfect+score.good*0.7)/total*100)-Math.max(0,score.whiff-5)),ok=v===quiz.answer;
  const rank=stage.ranks[acc>=85?0:acc>=60?1:2],age=quickAge(acc),P=DATA.profile||{},real=P.age||0,diff=real?real-age:0;
  lastResult={acc,ok,rank,stage,age,real,diff,nick:P.nick||''};const newBest=record(lastResult);
  const ageLine=!real?'':diff>0?`<br><span style="font-size:21px;color:#2f6b2a">실제 ${real}세보다 ${diff}살 젊어요!</span>`:diff===0?'<br><span style="font-size:22px">실제 나이랑 똑같아요!</span>':'<br><span style="font-size:20px">다음 판엔 더 젊어질 거예요!</span>';
  $('rTitle').innerHTML=`${rank}<br><span style="font-family:\'Noto Sans KR\',sans-serif;font-size:18px;color:#6b5236">⚡ 재미로 보는 순발력 나이</span><br><span style="font-size:60px;color:#b4441a">${age}세</span>${ageLine}`;
  $('rQuiz').innerHTML=ok?`<span class="ok">⭕ 정답! (${quiz.answerText})</span>`:`<span class="no">❌ 아쉬워요! 정답은 ${quiz.answerText}</span>`;
  $('rScore').innerHTML=`${stage.skill} 정확도 <b>${acc}점</b><br>${stage.hitText[0]} ${score.perfect} · 좋아요 ${score.good} · 아이고 ${score.miss}${score.whiff>5?` · 헛손질 ${score.whiff}`:''}`;
  $('rMsg').textContent=(newBest?'🎉 새 최고 기록! ':'')+(ok&&acc>=85?'손도 눈도 아주 좋으시네요!':ok?'눈썰미가 대단하세요! 손은 조금 더~':acc>=85?`${stage.skill}은 완벽! 다음엔 배경도 살펴보세요`:'한 판 더 하면 금방 늘어요!');
  $('resultOv').classList.remove('hidden');}
// 재미용: 박자 오차(평균)와 정확도로 계산, 20~75세로 제한 (의학적 의미 없음)
function quickAge(acc){if(!errs.length)return 75;const ms=errs.reduce((a,b)=>a+b,0)/errs.length*1000;
  return Math.round(Math.min(75,Math.max(20,20+ms*0.35+(100-acc)*0.4)));}
$('againBtn').onclick=()=>startGame(stage);

const CAL_BPM=100,CAL_N=12,CAL_SKIP=4;let calTaps=[],calStart=0,calTimer=null;
function showOffset(){$('offsetNow').textContent=OFFSET?`현재 보정값: ${OFFSET>0?'+':''}${OFFSET.toFixed(2)}초`:'';}

$('calibOpen').onclick=()=>{hideAll();$('calibMsg').textContent='';$('calibOv').classList.remove('hidden');state='calib';};

$('calibReset').onclick=()=>{OFFSET=0;try{localStorage.removeItem('gh_offset');}catch(e){}$('calibMsg').textContent='보정값을 0으로 되돌렸어요';};
$('calibStart').onclick=()=>{ensureAudio();calTaps=[];const b=60/CAL_BPM;calStart=ac.currentTime+0.5;
  for(let i=0;i<CAL_N;i++)tone(i%4===0?1500:1150,calStart+i*b,0.07,'square',0.12);
  $('calibMsg').textContent='소리에 맞춰 톡! 톡!';clearTimeout(calTimer);calTimer=setTimeout(finishCal,(0.5+CAL_N*b+0.6)*1000);};
$('calibPad').addEventListener('pointerdown',e=>{e.preventDefault();if(!ac||!calStart)return;calTaps.push(ac.currentTime-(ac.outputLatency||0)-calStart);
  e.currentTarget.animate([{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:120});});
function finishCal(){const b=60/CAL_BPM,d=[];
  for(const t of calTaps){const i=Math.round(t/b);if(i<CAL_SKIP||i>=CAL_N)continue;const e=t-i*b;if(Math.abs(e)<0.35)d.push(e);}
  calStart=0;
  if(d.length<4){$('calibMsg').textContent='톡 누른 횟수가 부족해요. 다시 해볼까요?';return;}
  d.sort((a,b)=>a-b);const med=d[Math.floor(d.length/2)];OFFSET=Math.max(-0.3,Math.min(0.3,Math.round(med*100)/100));
  try{localStorage.setItem('gh_offset',String(OFFSET));}catch(e){}
  $('calibMsg').textContent=Math.abs(OFFSET)<0.03?'박자가 딱 맞아요! 보정 필요 없어요 👍':`보정 완료! (${OFFSET>0?'+':''}${OFFSET.toFixed(2)}초) 이제 판정이 맞춰져요`;}

  try{const blob=await new Promise(res=>c.toBlob(res,'image/png'));const file=new File([blob],'golmok-hanpan.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:text+'\n'+SITE});return;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  $('cardImg').src=c.toDataURL('image/png');$('copyMsg').textContent='';hideAll();$('cardOv').classList.remove('hidden');}
$('shareBtn').onclick=share;
$('cardClose').onclick=()=>{hideAll();$('resultOv').classList.remove('hidden');};
$('copyBtn').onclick=async()=>{const text=shareText()+'\n'+SITE;
  try{await navigator.clipboard.writeText(text);$('copyMsg').textContent='복사됐어요! 카톡에 붙여넣기 하세요';}catch(e){$('copyMsg').textContent=SITE;}};

function shareText(){const r=lastResult;return `[골목한판] ${r.stage.name} — 내 순발력 나이 ${r.age}세!${r.diff>0?` (실제보다 ${r.diff}살 젊음)`:''} 나도 한 판 해볼까?`;}

// ===== 프로필 · 기록 · 오늘의 한판 (기기 저장) =====
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dstr(new Date());}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dstr(d);}
function dailyStage(){const d=new Date(),n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);return STAGES[n%STAGES.length];}
function streakNow(){return(DATA.lastDate===today()||DATA.lastDate===yesterday())?DATA.streak:0;}
function record(r){const t=today();if(DATA.lastDate!==t){DATA.streak=DATA.lastDate===yesterday()?DATA.streak+1:1;DATA.lastDate=t;}
  DATA.plays++;DATA.history.push({d:t,s:r.stage.id,acc:r.acc,age:r.age,ok:r.ok});if(DATA.history.length>60)DATA.history.shift();
  const b=DATA.best[r.stage.id],newBest=!!b&&r.acc>b.acc;DATA.best[r.stage.id]=b?{acc:Math.max(b.acc,r.acc),age:Math.min(b.age,r.age)}:{acc:r.acc,age:r.age};save();return newBest;}
function goHome(){state='idle';hideAll();renderStart();$('startOv').classList.remove('hidden');}
const ICON={nail:{c:'#8a5a3b',p:'<path d="M4 20l9-9"/><rect x="11" y="3" width="9" height="6" rx="1" transform="rotate(45 15.5 6)"/>'},
  dadeumi:{c:'#7d6b3f',p:'<rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 4l3 10M17 4l-3 10"/>'},
  bus:{c:'#2f7f86',p:'<rect x="3" y="6" width="18" height="11" rx="3"/><path d="M3 12h18"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/>'}};
const icon=(id,z)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="#fbeed7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[id].p}</svg>`;
const FLAME='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffb36b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 1 1 2 2 3 4 0-3 0-5 0-8z"/></svg>';
const CHEV='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a6a48" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
function renderStart(){const p=DATA.profile||{};$('greet').textContent=p.nick?`${p.nick}님, 반가워요!`:'추억의 골목에서 한 판!';
  const s=streakNow();$('streak').innerHTML=s?`${FLAME}${s}일 연속`:'';
  const ds=dailyStage(),done=DATA.lastDate===today(),d=new Date();
  $('todayDate').textContent=done?'오늘 한 판 완료!':`오늘의 한판 · ${d.getMonth()+1}월 ${d.getDate()}일`;
  $('todayIcon').style.background=ICON[ds.id].c;$('todayIcon').innerHTML=icon(ds.id,38);$('todayName').textContent=ds.name;$('todayDesc').textContent=ds.desc;
  $('dailyBtn').textContent=done?'또 한 판 하기':'한 판 시작하기';
  const h=DATA.history,best=h.length?Math.min(...h.map(x=>x.age)):0;$('stBest').textContent=best?best+'세':'-';
  if(p.age){$('stLabel2').textContent='실제 나이보다';$('stDiff').textContent=!best?'-':p.age-best>0?`${p.age-best}살 젊음`:'비슷해요';}
  else{$('stLabel2').textContent='지금까지';$('stDiff').textContent=`${DATA.plays}판`;}
  $('stageList').innerHTML=STAGES.map((st,i)=>{const b=DATA.best[st.id];return `<button class="srow" data-i="${i}"><span class="si" style="background:${ICON[st.id].c}">${icon(st.id,26)}</span><span style="flex:1;min-width:0"><span class="sn">${st.name}</span><span class="sd">${b?`최고 ${b.acc}점 · ${b.age}세`:st.desc}</span></span>${CHEV}</button>`;}).join('');
  showOffset();}
$('dailyBtn').onclick=()=>startGame(dailyStage());
// 프로필
let gSel='';
function openProfile(){const p=DATA.profile||{};$('profTitle').textContent=DATA.profile?'내 정보':'반가워요!';$('profSave').textContent=DATA.profile?'저장':'저장하고 시작';applySettings();$('pNick').value=p.nick||'';$('pAge').value=p.age||'';gSel=p.gender||'';
  [...$('pGender').children].forEach(b=>b.classList.toggle('on',p.gender!==undefined&&b.dataset.g===gSel));hideAll();$('profOv').classList.remove('hidden');}
$('profOpen').onclick=openProfile;
$('pGender').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;gSel=b.dataset.g;[...$('pGender').children].forEach(x=>x.classList.toggle('on',x===b));});
const ageStep=d=>{const v=parseInt($('pAge').value)||65;$('pAge').value=Math.max(10,Math.min(110,v+d));};
$('ageMinus').onclick=()=>ageStep(-1);$('agePlus').onclick=()=>ageStep(1);
$('profSave').onclick=()=>{const a=parseInt($('pAge').value);DATA.profile={nick:$('pNick').value.trim().slice(0,10),age:a>=10&&a<=110?a:0,gender:gSel};save();goHome();};
$('profSkip').onclick=()=>{DATA.asked=true;save();goHome();};
// 기록
function renderRec(){const h=DATA.history;
  if(!h.length){$('recBody').innerHTML='<p style="text-align:center">아직 기록이 없어요.<br>한 판 해볼까요?</p>';return;}
  const bestAge=Math.min(...h.map(x=>x.age));
  let html=`<div class="sum"><div><b>${DATA.plays}</b>판</div><div><b>${streakNow()}</b>일 연속</div><div><b>${bestAge}세</b>최고 순발력</div></div>`;
  html+='<h3>판별 최고 기록</h3>'+STAGES.map(s=>{const b=DATA.best[s.id];return `<div class="rrow"><span>${s.icon} ${s.name}</span><span>${b?`${b.acc}점 · ${b.age}세`:'-'}</span></div>`;}).join('');
  html+='<h3>최근 순발력 나이 <span class="sub">(막대가 짧을수록 젊어요)</span></h3>'+h.slice(-10).map(x=>`<div class="bar"><span class="bl">${x.d.slice(5).replace('-','/')}</span><span class="bt"><i style="width:${Math.round(x.age/75*100)}%"></i></span><span class="bv">${x.age}세</span></div>`).join('');
  $('recBody').innerHTML=html;}
$('recOpen').onclick=()=>{renderRec();hideAll();$('recOv').classList.remove('hidden');};
$('recClose').onclick=goHome;
// 설정
function markSeg(id,val){[...$(id).children].forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.v)===val));}
function applySettings(){const S=DATA.settings;document.body.classList.toggle('bigtext',!!S.big);if(master)master.gain.value=S.vol;markSeg('sVol',S.vol);markSeg('sBig',S.big);markSeg('sVib',S.vib);}
function bindSeg(id,key,demo){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;DATA.settings[key]=parseFloat(b.dataset.v);save();applySettings();if(demo)demo();});}
bindSeg('sVol','vol',()=>{ensureAudio();tone(880,ac.currentTime+0.02,0.18,'triangle',0.16);});
bindSeg('sBig','big');
bindSeg('sVib','vib',()=>{if(DATA.settings.vib)try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}});
applySettings();
// 첫 방문이면 프로필부터
if(!DATA.profile&&!DATA.asked)openProfile();else renderStart();

requestAnimationFrame(loop);
}
</script>
</body>
</html>
